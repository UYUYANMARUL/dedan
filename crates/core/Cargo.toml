[package]
name = "dedan-core"
version = "0.1.0"
description = "Shared, pure part of the Dedan CDN: envelopes, fetch tokens, Merkle encoding, latency map, slot assignment, scoring, registry cache"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
alloy = { version = "2.5", features = ["provider-http", "rpc-types", "sol-types", "signer-local", "contract"] }
alloy-ens = "2.5"
h3o = "0.11"
hex = "0.4"
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
