[package]
name = "dedan-resolver"
version = "0.1.0"
description = "Dedan's authoritative nameserver: node records from ENS, steering from the latency map on chain"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dedan-core = { path = "../core" }
alloy = { version = "2.5", features = ["provider-http", "rpc-types", "sol-types", "contract"] }
async-trait = "0.1"
axum = "0.8"
hickory-proto = "0.26"
hickory-server = "0.26"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
