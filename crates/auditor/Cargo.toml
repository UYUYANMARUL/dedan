[package]
name = "dedan-auditor"
version = "0.1.0"
description = "Dedan's auditor app: round trips attested to the registry from its own cell, assigned probes shipped to the aggregator"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dedan-core = { path = "../core" }
alloy = { version = "2.5", features = ["provider-http", "rpc-types", "sol-types", "signer-local", "contract"] }
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
