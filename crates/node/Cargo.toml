[package]
name = "dedan-node"
version = "0.1.0"
description = "Dedan's CDN node: a Pingora reverse proxy with a cache, fetch tokens, heartbeats and the class blob"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dedan-core = { path = "../core" }
pingora = { version = "0.9", features = ["proxy", "cache", "rustls"] }
rand = "0.9"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
tokio-stream = "0.1"
x509-parser = "0.16"
async-trait = "0.1"
alloy = { version = "2.5", features = ["provider-http", "rpc-types", "sol-types", "signer-local", "contract"] }
bytes = "1"
hex = "0.4"
http = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
