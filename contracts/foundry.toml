[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# the ENSv2 core contracts pin 0.8.25 exactly; everything of ours accepts it
solc = "0.8.25"
evm_version = "cancun"
optimizer = true
optimizer_runs = 100
ignored_warnings_from = ["lib/"]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fmt]
line_length = 120
