# Dedan local devnet. `make devnet` from the repo root brings it up; `make smoke` and `make demo` exercise it.
#
#   anvil         local chain (chain id 31337), anvil default accounts hold 1,000,000 mock USDC each
#   deployer      one-shot: installs Solidity deps, deploys Registry + Settlement + mocks, writes contracts/deployments/devnet.json
#   resolver      the Dedan nameserver (crates/resolver): node records from ENS, steering from the latency map on
#                 chain, ACME TXT records from its management API, plus the customers' own zones (deploy/resolver/zones)
#   pebble        ACME CA (stands in for Let's Encrypt), validates DNS-01 against the resolver
#   origin        sample customer origin with assets and large blobs, located in New York on the simulated WAN
#   frankfurt, tokyo, seoul, newyork, istanbul
#                 Dedan nodes (crates/node, Pingora): cache in front of the origin, hourly token keys revealed on chain,
#                 heartbeats to the nameserver
#   user-<city>   a shell per city on the simulated WAN whose DNS goes to the resolver: attester and end user
#   cp            the control plane (crates/cp): signed configs, purges, ACME orders for the nodes; :8070
#   dashboard     demo web page on :9090 (nodes from ENS, the map, container logs, add a node at a location)
#   dozzle        container logs and a browser terminal into any container, on :9999
#   lego          (profile smoke) ACME client that issues a certificate through the mock DNS, as a node would
#   auditor-<city>
#                 (profile settlement) the auditor app (crates/auditor) run by each city's human: attestations to
#                 the registry from its cell, assigned probes shipped to the aggregator
#   aggregator, countersigner
#                 (profile settlement) crates/aggregator: probe results in, published inputs and countersigned
#                 roots out every DEDAN_PERIOD_SECS; the countersigner recomputes every period before signing
#   auditor-spoof, auditor-liar, origin-tampered
#                 (profile sabotage) the bad actors of `make demo-settlement`
#   kubo          (profile full) IPFS node for the aggregator's published inputs, used from Phase 3 on
#
# Simulated WAN: the "wan" network (10.77.0.0/16, one /20 per city) with fixed addresses; every member applies tc netem
# delays toward every city's /20 from deploy/wan/latency.txt (round trips: Frankfurt-New York 90 ms, Tokyo-Istanbul 280 ms).

name: dedan-devnet

x-foundry: &foundry
  image: ghcr.io/foundry-rs/foundry:latest
  entrypoint: ["sh", "-c"]

x-wan: &wan
  image: dedan-wan:local
  build: ./wan
  cap_add:
    - NET_ADMIN

# a Dedan node (crates/node): Pingora proxy + cache in front of the account's origin, real hourly token keys
# revealed on chain by its hot key, heartbeats to the nameserver; WAN delays like every other city container
x-node: &node
  image: dedan-services:local
  cap_add:
    - NET_ADMIN
  command: ["sh", "-c", "/wan/wan.sh && exec dedan-node"]
  volumes:
    - ../contracts/deployments:/deployments:ro
    - ./devnet:/devnet:ro
    - ./wan/wan.sh:/wan/wan.sh:ro
    - ./wan/hosts.txt:/wan/hosts.txt:ro
    - ./wan/latency.txt:/wan/latency.txt:ro
  depends_on:
    - origin
    - resolver
    - cp

x-node-env: &node-env
  DEDAN_RPC_URL: http://anvil:8545
  DEDAN_DEPLOYMENT: /deployments/devnet.json
  DEDAN_ACCOUNTS: /devnet/accounts.json
  DEDAN_MNEMONIC: "test test test test test test test test test test test junk"
  DEDAN_RESOLVERS: http://10.77.0.53:8055
  DEDAN_CP_URL: http://cp:8070
  DEDAN_ZONE: dedan-cdn.test
  DEDAN_REVEAL_IMMEDIATELY: "1" # devnet: tokens verify at once instead of after the hour
  DEDAN_DEFAULT_TTL_SECS: "60" # only for a config whose cache rules give no TTL (acme's give 60 s, so `make e2e` shows stale objects within a minute)
  RUST_LOG: info

x-user: &user
  <<: *wan
  command: ["sh", "-c", "/docker-entrypoint.d/05-wan.sh && exec sleep infinity"]
  dns:
    - 10.77.0.53 # like an end user's ISP resolver: Docker's embedded DNS forwards to the nameserver
  depends_on:
    - resolver

x-chain-env: &chain-env
  DEDAN_RPC_URL: http://anvil:8545
  DEDAN_DEPLOYMENT: /deployments/devnet.json
  DEDAN_ACCOUNTS: /devnet/accounts.json
  DEDAN_HOSTS: /wan/hosts.txt:/devnet/dynamic-hosts.txt
  DEDAN_MNEMONIC: "test test test test test test test test test test test junk"
  DEDAN_PERIOD_SECS: "120" # a settlement day compressed into two minutes; the same code settles daily in production
  DEDAN_SAMPLE_N: "4"
  DEDAN_MAP_K: "1" # one human per city on the devnet; the code's default is the documented 3
  DEDAN_CP_URL: http://cp:8070 # the account-signed configs the control plane relays
  DEDAN_AUDITORS_PER_ACCOUNT: "10" # every staked auditor of the devnet probes acme; the default is 5 per account
  RUST_LOG: info

x-chain-volumes: &chain-volumes
  - ../contracts/deployments:/deployments:ro
  - ./devnet:/devnet:ro
  - ./wan/hosts.txt:/wan/hosts.txt:ro

# the auditor app on the simulated WAN: the same delays as the city's user, its DNS at the nameserver
x-auditor: &auditor
  image: dedan-services:local
  profiles: ["settlement"]
  cap_add:
    - NET_ADMIN
  command: ["sh", "-c", "/wan/wan.sh && exec dedan-auditor"]
  dns:
    - 10.77.0.53
  volumes:
    - ../contracts/deployments:/deployments:ro
    - ./devnet:/devnet:ro
    - ./wan/wan.sh:/wan/wan.sh:ro
    - ./wan/hosts.txt:/wan/hosts.txt:ro
    - ./wan/latency.txt:/wan/latency.txt:ro
  depends_on:
    - resolver
    - aggregator

x-auditor-env: &auditor-env
  <<: *chain-env
  DEDAN_AGGREGATOR: http://aggregator:8060
  DEDAN_PROBE_MEAN_SECS: "5"
  DEDAN_ATTEST_SECS: "60"
  DEDAN_BATCH_SECS: "20"

services:
  anvil:
    <<: *foundry
    command: ["anvil --host 0.0.0.0 --port 8545 --chain-id 31337 --block-time 2 --accounts 60"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast chain-id --rpc-url http://127.0.0.1:8545"]
      interval: 2s
      timeout: 3s
      retries: 30

  deployer:
    <<: *foundry
    command: ["/repo/deploy/scripts/deployer.sh"]
    working_dir: /repo/contracts
    volumes:
      - ..:/repo
      - foundry-home:/home/foundry # keeps the downloaded solc between runs
    environment:
      RPC_URL: http://anvil:8545
    depends_on:
      anvil:
        condition: service_healthy

  resolver:
    image: dedan-services:local
    build:
      context: ..
      dockerfile: crates/Dockerfile
    environment:
      DEDAN_HEARTBEAT_TIMEOUT_SECS: "30" # a node without a heartbeat for 30 s is not answered
      DEDAN_CP_URL: http://cp:8070 # signed account configs; the account file until the control plane answers
      DEDAN_CHALLENGE_SECS: "600" # a name's endpoint must answer the challenge before its record is served
      DEDAN_RPC_URL: http://anvil:8545
      DEDAN_DEPLOYMENT: /deployments/devnet.json
      DEDAN_ACCOUNTS: /devnet/accounts.json
      DEDAN_HOSTS: /wan/hosts.txt:/devnet/dynamic-hosts.txt # the second one lists cities added while running
      DEDAN_ZONES_DIR: /zones
      DEDAN_MAP_K: "1"
      DEDAN_PERIOD_SECS: "120" # prices a period for the balance check: an account needs 4 periods of list price
      DEDAN_AGGREGATOR_URL: http://aggregator:8060 # the published period the sets are sticky on (settlement profile)
      RUST_LOG: info
    volumes:
      - ../contracts/deployments:/deployments:ro
      - ./devnet:/devnet:ro
      - ./resolver/zones:/zones:ro
      - ./wan/hosts.txt:/wan/hosts.txt:ro
    networks:
      default: {}
      wan:
        ipv4_address: 10.77.0.53 # outside every city's /20 on purpose: anycast, no simulated delay
    ports:
      - "15353:53/udp" # 5353 is macOS mDNS; dig -p 15353 @127.0.0.1 acme.dedan-cdn.test +subnet=10.77.32.30/24
      - "15353:53/tcp"
      - "8055:8055" # management API: /nodes, /map, /assignment, /set-txt, /clear-txt
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8055/health"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      anvil:
        condition: service_healthy

  # the control plane (crates/cp): relays the configs and purges customers sign with their account keys over a
  # replayable event stream, ACME orders at Pebble (`shortlived` profile, ARI renewals) with DNS-01 through the
  # nameserver's TXT API, certificates back to the nodes; `dedan-cp config|purge` is the customer's CLI
  cp:
    image: dedan-services:local
    command: ["dedan-cp"]
    environment:
      DEDAN_RPC_URL: http://anvil:8545
      DEDAN_DEPLOYMENT: /deployments/devnet.json
      DEDAN_ACCOUNTS: /devnet/accounts.json
      DEDAN_MNEMONIC: "test test test test test test test test test test test junk"
      DEDAN_KEY_INDEX: "10"
      DEDAN_RESOLVERS: http://resolver:8055
      DEDAN_ACME_DIR: https://pebble:14000/dir
      DEDAN_ACME_ROOT: /pebble-certs/pebble.minica.pem
      DEDAN_ZONE: dedan-cdn.test
      RUST_LOG: info
    volumes:
      - ../contracts/deployments:/deployments:ro
      - ./devnet:/devnet:ro
      - pebble-certs:/pebble-certs:ro
      - cp-data:/data # the accepted configs and the event seq, kept across restarts
    ports:
      - "8070:8070" # /health, /v1/configs (GET, POST), /v1/stream, POST /v1/purge, POST /v1/certs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8070/health"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      - pebble
      - resolver

  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    command: ["-config", "/pebble/config.json", "-dnsserver", "resolver:53"]
    environment:
      PEBBLE_VA_NOSLEEP: "1"
    volumes:
      - ./pebble/config.json:/pebble/config.json:ro
      - pebble-certs:/test/certs
    ports:
      - "14000:14000"
      - "15000:15000"
    depends_on:
      - resolver

  origin:
    <<: *wan
    environment:
      CITY: newyork
    volumes:
      - ./origin/html:/usr/share/nginx/html
      - ./origin/10-blobs.sh:/docker-entrypoint.d/10-blobs.sh:ro
    networks:
      default: {}
      wan:
        ipv4_address: 10.77.64.20
    ports:
      - "8080:80"

  frankfurt:
    <<: *node
    environment:
      <<: *node-env
      CITY: frankfurt
      NODE_ID: frankfurt
      DEDAN_KEY_INDEX: "12" # the node's hot key (ROLE_NODE_SIGNER)
    networks:
      default: {}
      wan:
        ipv4_address: 10.77.16.1
    ports:
      - "8011:80"

  tokyo:
    <<: *node
    environment:
      <<: *node-env
      CITY: tokyo
      NODE_ID: tokyo
      DEDAN_KEY_INDEX: "13" # the node's hot key (ROLE_NODE_SIGNER)
    networks:
      default: {}
      wan:
        ipv4_address: 10.77.32.1
    ports:
      - "8012:80"

  seoul:
    <<: *node
    environment:
      <<: *node-env
      CITY: seoul
      NODE_ID: seoul
      DEDAN_KEY_INDEX: "14" # the node's hot key (ROLE_NODE_SIGNER)
    networks:
      default: {}
      wan:
        ipv4_address: 10.77.48.1
    ports:
      - "8013:80"

  newyork:
    <<: *node
    environment:
      <<: *node-env
      CITY: newyork
      NODE_ID: newyork
      DEDAN_KEY_INDEX: "15" # the node's hot key (ROLE_NODE_SIGNER)
    networks:
      default: {}
      wan:
        ipv4_address: 10.77.64.1
    ports:
      - "8014:80"

  istanbul:
    <<: *node
    environment:
      <<: *node-env
      CITY: istanbul
      NODE_ID: istanbul
      DEDAN_KEY_INDEX: "16" # the node's hot key (ROLE_NODE_SIGNER)
    networks:
      default: {}
      wan:
        ipv4_address: 10.77.80.1
    ports:
      - "8015:80"

  user-frankfurt:
    <<: *user
    environment:
      CITY: frankfurt
    networks:
      wan:
        ipv4_address: 10.77.16.30

  user-tokyo:
    <<: *user
    environment:
      CITY: tokyo
    networks:
      wan:
        ipv4_address: 10.77.32.30

  user-seoul:
    <<: *user
    environment:
      CITY: seoul
    networks:
      wan:
        ipv4_address: 10.77.48.30

  user-newyork:
    <<: *user
    environment:
      CITY: newyork
    networks:
      wan:
        ipv4_address: 10.77.64.30

  user-istanbul:
    <<: *user
    environment:
      CITY: istanbul
    networks:
      wan:
        ipv4_address: 10.77.80.30

  aggregator:
    image: dedan-services:local
    profiles: ["settlement"]
    command: ["dedan-aggregator", "serve"]
    environment:
      <<: *chain-env
      DEDAN_KEY_INDEX: "8"
      DEDAN_COUNTERSIGNER: http://countersigner:8061
      DEDAN_DATA: /data
      DEDAN_GRACE_SECS: "10"
    volumes:
      - ../contracts/deployments:/deployments:ro
      - ./devnet:/devnet:ro
      - ./wan/hosts.txt:/wan/hosts.txt:ro
      - settlement-data:/data
    ports:
      - "8060:8060" # /health, /periods, POST /v1/probe-results
    depends_on:
      - resolver
      - countersigner
      - origin

  countersigner:
    image: dedan-services:local
    profiles: ["settlement"]
    command: ["dedan-aggregator", "countersign"]
    environment:
      <<: *chain-env
      DEDAN_KEY_INDEX: "9"
      DEDAN_DATA: /data
    volumes:
      - ../contracts/deployments:/deployments:ro
      - ./devnet:/devnet:ro
      - ./wan/hosts.txt:/wan/hosts.txt:ro
      - settlement-data:/data # the aggregator's published inputs, read back independently before signing
    ports:
      - "8061:8061"
    depends_on:
      - resolver

  auditor-frankfurt:
    <<: *auditor
    environment:
      <<: *auditor-env
      CITY: frankfurt
      DEDAN_KEY_INDEX: "20"
      DEDAN_LOCATION: "50.1109,8.6821"
    networks:
      default: {}
      wan:
        ipv4_address: 10.77.16.31

  auditor-tokyo:
    <<: *auditor
    environment:
      <<: *auditor-env
      CITY: tokyo
      DEDAN_KEY_INDEX: "21"
      DEDAN_LOCATION: "35.6762,139.6503"
    networks:
      default: {}
      wan:
        ipv4_address: 10.77.32.31

  auditor-seoul:
    <<: *auditor
    environment:
      <<: *auditor-env
      CITY: seoul
      DEDAN_KEY_INDEX: "22"
      DEDAN_LOCATION: "37.5665,126.978"
    networks:
      default: {}
      wan:
        ipv4_address: 10.77.48.31

  auditor-newyork:
    <<: *auditor
    environment:
      <<: *auditor-env
      CITY: newyork
      DEDAN_KEY_INDEX: "23"
      DEDAN_LOCATION: "40.7128,-74.006"
    networks:
      default: {}
      wan:
        ipv4_address: 10.77.64.31

  auditor-istanbul:
    <<: *auditor
    environment:
      <<: *auditor-env
      CITY: istanbul
      DEDAN_KEY_INDEX: "24"
      DEDAN_LOCATION: "41.0082,28.9784"
    networks:
      default: {}
      wan:
        ipv4_address: 10.77.80.31

  # a human on an Istanbul network claiming the Seoul cell: it attests Seoul's members from 9,000 km away, and
  # every attestation lands in evidence as out_of_area (the contract counts it as one vote)
  auditor-spoof:
    <<: *auditor
    profiles: ["sabotage"]
    environment:
      <<: *auditor-env
      CITY: istanbul
      DEDAN_KEY_INDEX: "25"
      DEDAN_LOCATION: "37.5665,126.978"
      DEDAN_PROBES: "0"
    networks:
      default: {}
      wan:
        ipv4_address: 10.77.80.32

  # an auditor in New York that never fetches anything and reports every probe up with a made-up token
  auditor-liar:
    <<: *auditor
    profiles: ["sabotage"]
    environment:
      <<: *auditor-env
      CITY: newyork
      DEDAN_KEY_INDEX: "26"
      DEDAN_LOCATION: "40.7128,-74.006"
      DEDAN_DEVNET_LIE: "1"
    networks:
      default: {}
      wan:
        ipv4_address: 10.77.64.32

  # the real origin's files with one byte appended to each: what a node serving wrong bytes looks like
  origin-tampered:
    <<: *wan
    profiles: ["sabotage"]
    environment:
      CITY: newyork
    volumes:
      - ./origin/html:/srv/origin:ro
      - ./origin/10-tamper.sh:/docker-entrypoint.d/10-tamper.sh:ro
    networks:
      default: {}
      wan:
        ipv4_address: 10.77.64.21

  lego:
    image: goacme/lego:latest
    profiles: ["smoke"]
    entrypoint: ["sh", "-c"]
    command: ["/lego-scripts/issue.sh"]
    environment:
      EXEC_PATH: /lego-scripts/set-txt.sh
      EXEC_PROPAGATION_TIMEOUT: "60"
      EXEC_POLLING_INTERVAL: "2"
      EXEC_SEQUENCE_INTERVAL: "2"
      LEGO_CA_CERTIFICATES: /pebble-certs/pebble.minica.pem
    volumes:
      - ./lego:/lego-scripts:ro
      - pebble-certs:/pebble-certs:ro
      - lego-data:/lego-data
    depends_on:
      - pebble
      - resolver

  kubo:
    image: ipfs/kubo:latest
    profiles: ["full"]
    ports:
      - "5001:5001"
      - "8081:8080"

  dashboard:
    build: ./dashboard
    image: dedan-dashboard:local
    working_dir: ${PWD} # the repo at its host path, so compose bind mounts made from inside resolve on the host
    environment:
      NS_API: http://resolver:8055
      DOZZLE_URL: http://localhost:9999
    volumes:
      - ${PWD}:${PWD}
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9090:9090"
    depends_on:
      - resolver

  dozzle:
    image: amir20/dozzle:latest
    environment:
      DOZZLE_ENABLE_SHELL: "true" # a terminal into any container from the browser (demo only: no auth)
      DOZZLE_FILTER: name=dedan-devnet
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9999:8080"

networks:
  default: {}
  wan:
    ipam:
      config:
        - subnet: 10.77.0.0/16

volumes:
  pebble-certs:
  cp-data:
  lego-data:
  settlement-data:
  foundry-home:
    name: dedan-foundry-home # shared with the Makefile's docker-run targets
